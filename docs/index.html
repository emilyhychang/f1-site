<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RYAN'S SCUDERIA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="schedule.html">Schedule</a>
    <a href="results.html">Results</a>
    <a href="analysis.html">Analysis</a>
    <a href="fantasy.html">Fantasy</a>
  </nav>

  <div class="hero">
    <h1>RYAN'S SCUDERIA</h1>

    <div class="race-preview">
      <div class="next-race-badge" id="next-race-badge">
        <div class="label">Next Race</div>
        <div class="name" id="next-race-name">Loading...</div>
        <div id="next-race-countdown"></div>
      </div>

      <svg id="track-svg" viewBox="0 0 600 400">
        <path id="track-path" fill="none" stroke="#444" stroke-width="4"/>
        <circle id="car-marker" r="7" fill="var(--red)" stroke="#fff" stroke-width="1.5"/>
      </svg>
    </div>
  </div>

  <div class="container">
    <h1>2026 Driver Standings</h1>
    <table id="standings-table">
      <thead><tr><th>#</th><th>Driver</th><th>Team</th><th>Points</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="js/home.js"></script>
