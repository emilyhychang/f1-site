<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Analysis - Garage 16</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="schedule.html">Schedule</a>
    <a href="results.html">Results</a>
    <a href="analysis.html">Analysis</a>
  </nav>

  <div class="container">
    <h1>Race Analysis</h1>
    <select id="round-picker"></select>

    <h2 class="section-title">Fastest Laps</h2>
    <table id="fastest-table">
      <thead><tr><th>#</th><th>Driver</th><th>Time</th><th>Lap</th><th>Tire</th></tr></thead>
      <tbody></tbody>
    </table>

    <h2 class="section-title">Lap Times</h2>
    <canvas id="laptime-chart" height="90"></canvas>

    <h2 class="section-title">Tire Strategy</h2>
    <div id="tire-chart"></div>

    <h2 class="section-title">Telemetry Comparison (Fastest Lap)</h2>
    <canvas id="speed-chart" height="80"></canvas>
    <canvas id="throttle-brake-chart" height="80"></canvas>
  </div>

  <script src="js/analysis.js"></script>
</body>
</html>
