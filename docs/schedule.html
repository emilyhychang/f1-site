<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendar — Scuderia 16</title><link rel="stylesheet" href="css/style.css"></head><body><main class="page"><div class="section-head"><div><div class="eyebrow">2026 / The Road</div><h1 class="display">CALENDAR</h1></div><p>Every stop on the 2026 calendar, presented as a race-weekend timeline. The next round is highlighted automatically.</p></div><div id="calendar" class="timeline"></div></main><script src="js/app.js"></script><script>fetch('data/schedule_2026.json').then(r=>r.json()).then(data=>{const el=document.getElementById('calendar');data.filter(x=>x.RoundNumber>0).forEach(r=>{const row=document.createElement('div');row.className='panel timeline-item';row.innerHTML=`<div class="round">R${String(r.RoundNumber).padStart(2,'0')}</div><div class="event">${r.EventName}<div class="date">${r.Location}</div></div><div class="date">${new Date(r.EventDate).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</div>`;el.appendChild(row)})}).catch(()=>document.getElementById('calendar').innerHTML='<div class="panel">Calendar data unavailable.</div>')</script></body></html>
