name: Format all redesigned site files

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes prettier@3 --single-quote --trailing-comma none --arrow-parens avoid --write docs/analysis.html docs/charles.html docs/css/enhancements.css docs/css/style.css docs/fantasy.html docs/ferrari.html docs/index.html docs/js/analysis.js docs/js/app.js docs/js/driver-image-fix.js docs/js/driver-image.js docs/js/garage.js docs/js/predictor.js docs/js/results.js docs/js/schedule.js docs/results.html docs/schedule.html
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then exit 0; fi
          git add docs/analysis.html docs/charles.html docs/css/enhancements.css docs/css/style.css docs/fantasy.html docs/ferrari.html docs/index.html docs/js/analysis.js docs/js/app.js docs/js/driver-image-fix.js docs/js/driver-image.js docs/js/garage.js docs/js/predictor.js docs/js/results.js docs/js/schedule.js docs/results.html docs/schedule.html
          git commit -m "Format all redesigned site files"
          git push
