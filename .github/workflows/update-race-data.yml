name: Update F1 race data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-race-data.yml'
      - 'data_pipeline/**'
  schedule:
    # Refresh official schedule/profile data every day, plus more frequently
    # while race results are becoming available on Sundays and Mondays.
    - cron: '17 6 * * 2-5'
    - cron: '17 */6 * * 0,1,6'

permissions:
  contents: write

concurrency:
  group: update-f1-race-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt

      - name: Restore FastF1 cache
        uses: actions/cache@v4
        with:
          path: data_pipeline/cache
          key: fastf1-${{ runner.os }}-${{ hashFiles('data_pipeline/requirements.txt') }}
          restore-keys: |
            fastf1-${{ runner.os }}-

      - name: Install data dependencies
        run: python -m pip install -r data_pipeline/requirements.txt

      - name: Refresh race data
        run: python data_pipeline/fetch_data.py

      - name: Validate generated data
        run: python data_pipeline/validate_data.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- docs/data; then
            echo "Race data is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "Update F1 race data"
          git push
